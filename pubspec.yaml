name: roastlab
description: RoastLab, a coffee intelligence platform for roasting, grinding, brewing, and community learning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  image_picker: ^1.1.2
  image: ^4.5.4
  smooth_page_indicator: ^1.2.1
  fl_chart: ^1.0.0
  youtube_player_iframe: ^5.2.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/roastlab_app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#140f0c'
  adaptive_icon_foreground: assets/icons/roastlab_app_icon.png

flutter_native_splash:
  color: '#0e0a08'
  image: assets/icons/roastlab_splash.png
  android_12:
    color: '#0e0a08'
    image: assets/icons/roastlab_splash.png
